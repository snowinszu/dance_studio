name: Release (Windows)

# 手动触发：Actions 页面 → 「Release (Windows)」 → Run workflow。
# 打包 + 发布的实际逻辑在可复用工作流 release-build.yml。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（semver，如 1.2.0）。留空则用 package.json 的 version"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
