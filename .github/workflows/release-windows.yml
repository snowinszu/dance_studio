name: Release (Windows)

# 手动触发：Actions 页面 → 「Release (Windows)」 → Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（semver，如 1.2.0）。留空则用 package.json 的 version"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall（scripts/ensure-electron.js）会拉取 win32 版 Electron 二进制
      - run: npm ci

      # 解析版本：有输入则校验 semver 并写入 package.json；否则沿用 package.json
      - name: Resolve version
        id: ver
        shell: bash
        env:
          # 经 env 传入，避免把用户输入直接插进 shell 脚本（脚本注入）
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          IN="$VERSION_INPUT"
          if [ -n "$IN" ]; then
            if ! printf '%s' "$IN" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "::error::version 输入 '$IN' 不是合法 semver（示例：1.2.0 或 1.2.0-rc.1）"
              exit 1
            fi
            npm pkg set version="$IN"
          fi
          V="$(node -p "require('./package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "构建版本：$V"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Package (electron-builder, Windows x64)
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Checksums & job summary
        shell: bash
        run: |
          cd release
          {
            echo "## Windows x64 构建产物 — v${{ steps.ver.outputs.version }}"
            echo ""
            echo "| 文件 | 大小 (bytes) | SHA-256 |"
            echo "|---|---:|---|"
            for f in *.exe; do
              sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              echo "| \`$f\` | $sz | \`$sha\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-v${{ steps.ver.outputs.version }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
