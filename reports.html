<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据报表 · 晓·乐舞艺术空间</title>
  <!-- 设计令牌 stylesheet — Createthisprojecta design system tokens -->
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    /* ─── 令牌兜底（与 index.html 同一份，保证多页视觉一致）───────────────
       数据报表的模块身份色是首页卡片色 --cc-8（暗梅紫）。                  */
    :root {
      --bg:      oklch(99.5% 0.003 15);
      --surface: oklch(100% 0 0);
      --fg:      oklch(14% 0.010 0);
      --muted:   oklch(55% 0.008 0);
      --border:  oklch(93% 0.004 0);
      --accent:  oklch(57% 0.235 17);
      --accent-soft: color-mix(in oklch, var(--accent) 10%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 5%, transparent);
      --shadow-card: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);

      --cc-1: oklch(68% 0.165 25);    /* 活力珊瑚 · 考勤（预警红点复用）*/
      --cc-2: oklch(65% 0.130 152);   /* 鼠尾草绿 · 库存 */
      --cc-3: oklch(63% 0.155 234);   /* 晴空蓝   · 课程 */
      --cc-4: oklch(62% 0.135 293);   /* 薰衣草紫 · 学员 */
      --cc-5: oklch(73% 0.135 70);    /* 琥珀金   · 收支 */
      --cc-6: oklch(67% 0.145 356);
      --cc-7: oklch(66% 0.130 192);
      --cc-8: oklch(59% 0.145 308);   /* 暗梅紫   · 报表（模块身份色）*/

      --font-display: -apple-system, BlinkMacSystemFont, 'PingFang SC',
                      'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'PingFang SC',
                      'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;

      --radius:      12px;
      --radius-lg:   18px;
      --radius-pill: 999px;
      --radius-mark: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100vh; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }
    svg { display: block; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    /* ─── 顶部导航（复用 students.html 的 .topnav 规范）───────────────── */
    .topnav {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in oklch, var(--surface) 88%, transparent);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      border-bottom: 1px solid var(--border);
    }
    .topnav-inner {
      max-width: 1120px; margin-inline: auto;
      padding: 0 40px; height: 52px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-brand { display: flex; align-items: center; gap: 9px; }
    .xhs-mark {
      width: 28px; height: 28px;
      background: var(--accent); border-radius: var(--radius-mark);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .xhs-mark svg { width: 15px; height: 15px; color: var(--surface); }
    .nav-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: 0.01em; }
    .nav-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; color: var(--muted);
      padding: 8px 6px; border-radius: var(--radius);
      transition: color 0.15s;
    }
    .nav-back:hover { color: var(--fg); }
    .nav-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .nav-back svg { width: 15px; height: 15px; }

    /* ─── 主体容器 ─────────────────────────────────────────────────── */
    main { flex: 1; width: 100%; max-width: 1120px; margin-inline: auto; padding: 28px 40px 72px; }

    .page-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .page-title { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
    .page-sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }

    /* ─── 按钮 ─────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px; padding: 0 18px;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface); color: var(--fg);
      font-weight: 600; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn:hover { border-color: var(--muted); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    .btn-primary:hover { background: color-mix(in oklch, var(--accent) 88%, black); border-color: transparent; }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

    /* ─── 时间范围控件 ─────────────────────────────────────────────── */
    .range-control {
      display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
      margin-bottom: 22px;
    }
    .range-presets { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip-toggle {
      min-height: 44px; padding: 0 16px;
      border: 1px solid var(--border); border-radius: var(--radius-pill);
      background: var(--surface); color: var(--muted); font-weight: 600; cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .chip-toggle:hover { color: var(--fg); border-color: var(--muted); }
    .chip-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chip-toggle.on {
      color: var(--fg);
      background: color-mix(in oklch, var(--cc-8) 14%, var(--surface));
      border-color: color-mix(in oklch, var(--cc-8) 45%, var(--border));
    }
    .range-custom { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .range-custom input[type="date"] {
      min-height: 44px; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--fg); font: inherit;
    }
    .range-custom input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .range-custom .sep { color: var(--muted); }
    .range-note { color: var(--muted); font-size: 12px; }

    /* ─── 报表分区（可折叠）───────────────────────────────────────── */
    .report-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); margin-bottom: 14px; overflow: hidden;
    }
    .report-section > summary {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; min-height: 44px; cursor: pointer;
      font-family: var(--font-display); font-weight: 700; font-size: 15px;
      list-style: none;
    }
    .report-section > summary::-webkit-details-marker { display: none; }
    .report-section > summary .sec-chevron { transition: transform 0.15s; color: var(--muted); }
    .report-section[open] > summary .sec-chevron { transform: rotate(90deg); }
    .section-body { padding: 4px 20px 20px; }

    /* ─── KPI 卡片行 ──────────────────────────────────────────────── */
    .kpi-grid {
      display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }
    .kpi-card {
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; background: var(--surface);
    }
    .kpi-label { color: var(--muted); font-size: 12px; }
    .kpi-value {
      font-family: var(--font-display); font-weight: 800; font-size: 24px;
      font-variant-numeric: tabular-nums; margin-top: 4px;
    }
    .kpi-card.is-warn .kpi-value { color: var(--cc-1); }

    /* ─── 预警中心 ────────────────────────────────────────────────── */
    .alert-grid {
      display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .alert-group {
      border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
      display: flex; flex-direction: column;
    }
    .alert-group-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 10px 14px; font-weight: 700; font-size: 14px;
      background: color-mix(in oklch, var(--cc-1) 6%, var(--surface));
    }
    .alert-count {
      min-width: 22px; height: 22px; padding: 0 7px; border-radius: var(--radius-pill);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      background: var(--cc-1); color: var(--surface); font-variant-numeric: tabular-nums;
    }
    .alert-count.is-zero { background: var(--fg-soft); color: var(--muted); }
    .alert-list {
      list-style: none; margin: 0; padding: 8px 14px 12px;
      display: flex; flex-direction: column; gap: 5px; flex: 1;
    }
    .alert-list li { font-size: 13px; }
    .alert-list .a-none { color: var(--muted); }
    .alert-list .a-more { color: var(--muted); font-size: 12px; }

    /* ─── 通用表格 ────────────────────────────────────────────────── */
    .data-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .data-table th, .data-table td {
      text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
    }
    .data-table th { color: var(--muted); font-size: 12px; font-weight: 600; }
    .data-table th.sortable { cursor: pointer; user-select: none; }
    .data-table th.sortable.on { color: var(--fg); }
    .data-table td.num, .data-table th.num { text-align: right; }
    .table-scroll { overflow-x: auto; }

    /* ─── 空态 / 提示 ─────────────────────────────────────────────── */
    .empty {
      text-align: center; color: var(--muted);
      padding: 48px 24px; border: 1px dashed var(--border); border-radius: var(--radius-lg);
    }
    .empty strong { display: block; color: var(--fg); font-size: 16px; margin-bottom: 6px; }
    .sec-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

    /* ─── toast ───────────────────────────────────────────────────── */
    #toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
      background: var(--fg); color: var(--surface);
      padding: 10px 18px; border-radius: var(--radius-pill);
      font-size: 13px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
      max-width: 80vw; text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 920px) {
      .topnav-inner { padding-inline: 20px; }
      main { padding-inline: 20px; }
    }
  </style>
</head>
<body>

  <nav class="topnav">
    <div class="topnav-inner">
      <a class="nav-brand" href="index.html" aria-label="晓·乐舞艺术空间 首页">
        <span class="xhs-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.5l2.4 6.7 6.9.3-5.4 4.3 1.9 6.7L12 17l-5.7 3.8 1.9-6.7L2.8 9.8l6.9-.3z"/>
          </svg>
        </span>
        <span class="nav-title">晓·乐舞艺术空间</span>
      </a>
      <a class="nav-back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
        返回首页
      </a>
    </div>
  </nav>

  <main>
    <div id="view" aria-live="polite"></div>
  </main>

  <div id="toast" role="status"></div>

  <script type="module" src="reports.js"></script>
</body>
</html>
